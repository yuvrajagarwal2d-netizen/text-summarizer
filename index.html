<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
        
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <style>
        body {
            font-family: system-ui,'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #eff7f6;
            color:#003b02;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        h1{
            text-align: center;
        }
        textarea {
            background-color:#808080;
            color: #000000;
            border: 2px solid #000000;
        }
        textarea:focus {
            outline: none;
            border-color: #4b0c00;
        }

        button {
            background-color: #2563eb;
            color: white;
            border:none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #summary-output {
            background-color: #ffffff;
            border-left: 4px solid #808080;
            padding: 16px;
            border-radius: 8px;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Yuvraj's Text Summarizer</h1>
        <textarea id="user_input" rows="8" placeholder="Insert your text here..."></textarea>
        <button py-click="generate_summary">Summarize Text</button>
        <h3>Summary</h3>
        <div id="summary-output">Your summary will appear here</div>
    </div>
</body>
</html>
